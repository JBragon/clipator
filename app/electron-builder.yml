appId: org.clipator.app
productName: Clipator
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  # ícone da janela: o main lê resources/icon.png
  - resources/icon.png
# o node-pty (terminal das conversas com a IA) carrega binários nativos: ficam fora do .asar
asarUnpack:
  - node_modules/node-pty/**
extraResources:
  # o three.js da maquete 3D: o motor (Python) lê o arquivo, então ele fica fora do .asar
  - from: node_modules/three/build/three.min.js
    to: three/three.min.js
  - from: node_modules/three/LICENSE
    to: three/LICENSE
  - from: ../motor
    to: motor
    filter: ["pyproject.toml", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "src/**"]
win:
  target: nsis
# Instala só para o usuário, sem pedir admin. Os atalhos saem também no modo silencioso
# (/S) que o install.ps1 usa, e voltam a cada atualização.
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Clipator
mac:
  target: dmg
  category: public.app-category.video
linux:
  target: AppImage
  category: AudioVideo
publish:
  provider: github
  owner: JBragon
  repo: clipator
  releaseType: release
