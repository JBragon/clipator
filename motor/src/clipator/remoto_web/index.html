<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141518">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Clipator">
  <title>Clipator</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icone.svg">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="topo">
    <button id="voltar" class="icone" hidden aria-label="Voltar">‹</button>
    <img src="icone.svg" alt="" width="28" height="28">
    <div class="topo-texto">
      <strong>Clipator</strong>
      <span><span id="ponto" class="ponto"></span><span id="pc"></span></span>
    </div>
  </header>
  <main>
    <section id="jobs" aria-live="polite"></section>
    <section id="conteudo"></section>
  </main>
  <div id="rodape" class="rodape-fixo"></div>
  <div id="aviso" class="aviso" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
