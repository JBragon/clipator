# Histórias e minidocumentários: preto de cinema, âmbar de luz de tungstênio e títulos espaçados.
herda: base
nome: Documental
conceito:
  frase: "Preto de sala de cinema, âmbar de tungstênio e títulos espaçados: devagar, como capítulo de documentário."
  palavras_chave: [cinema, história, lento, atmosférico, capítulo]
  faca:
    - Título de capítulo espaçado, pequeno, centralizado, com muito vazio em volta.
    - Entradas por fade, longas; o corte seco fica para a virada da história.
    - Datas e lugares numa linha fina, sobre o vídeo.
    - Footage com grão leve e vinheta, levemente quente.
  nao_faca:
    - Legenda gigante ou colorida demais.
    - Efeito sonoro cômico.
    - Transição com zoom ou empurrão.
    - Selo chapado chamativo.
cor:
  paleta:
    fundo: "#0E0D0B"
    superficie: "#1B1916"
    texto: "#F2EEE6"
    texto_suave: "#ADA595"
    primaria: "#E8A33D"
    secundaria: "#5A4A33"
    destaque: "#8EBCCD"
    positivo: "#83BF82"
    negativo: "#DE6650"
    alerta: "#E07A3F"
  serie: [primaria, destaque, texto, texto_suave, "#C7865F", "#6F8F72"]
  gradientes:
    tungstenio: {tipo: radial, angulo: 0, paradas: [[secundaria, 0], [fundo, 1]]}
tipografia:
  papeis:
    titulo: {familia: Bebas Neue, reserva: Impact, peso: 400, caixa_alta: true, espacamento: 0.14, entrelinha: 1.05}
    subtitulo: {familia: Bebas Neue, reserva: Impact, peso: 400, caixa_alta: true, espacamento: 0.2}
    legenda: {familia: Montserrat ExtraBold, peso: 800, caixa_alta: false, entrelinha: 1.15}
  escala: {display: 0.1, h1: 0.07, h2: 0.05, h3: 0.04, corpo: 0.03, nota: 0.024}
layout: {raio: 0, traco: 0.003, sombra: null, densidade: arejada, margem: 0.09}
movimento:
  curvas:
    entrada: [0.33, 0, 0.2, 1]
    saida: [0.6, 0, 0.8, 0.6]
  duracoes: {micro: 0.15, curta: 0.4, media: 0.8, longa: 1.4}
  escalonamento: 0.14
  entrada: fade
  saida: fade
  transicao_padrao: fade
  transicoes: [corte, fade]
  principios:
    - Tudo entra por fade lento; o corte seco é reservado à virada da história.
    - O título de capítulo fica pelo menos 2 s parado na tela.
tratamento:
  contraste: 1.08
  saturacao: 0.85
  temperatura: 10
  grao: 4
  vinheta: 0.35
legenda:
  estilo: bloco
  tamanho: 0.048
  cor: neutro-2
  cor_destaque: primaria
  contorno: {cor: neutro-1, espessura: 0.08}
  sombra: {dx: 0, dy: 0.04, desfoque: 0.1, cor: neutro-1, alfa: 0.7}
  max_palavras: 7
  animacao: fade
graficos:
  tarja: {estilo: linha, posicao: inferior_esquerda, cor_fundo: fundo, cor_acento: primaria}
  selo: {estilo: sublinhado, cor_fundo: primaria, cor_texto: texto}
thumbnail:
  cor: texto
  cor_destaque: primaria
  fundo: gradiente:tungstenio
  tratamento_foto: {saturacao: 0.8, contraste: 1.12, contorno_pessoa: null}
som:
  identidade: "Atmosférico: drone grave, risers longos e nenhum efeito cômico."
  efeitos: {entrada: swoosh-reverso, enfase: riser, numero: click, alerta: impacto}
  volume_efeitos: 0.35
  musica: {clima: épico, bpm: [60, 90]}
cenas:
  tom: "Contemplativo: poucas telas, longas, que situam o espectador no tempo e no lugar."
  preferir: [local, linha_do_tempo, citacao, nome]
  evitar: [alerta, palavra]
  intervalo: 6.0
  por_minuto: 6
  duracao: [3.0, 8.0]
  palavras_titulo: 5
  abrir_com_titulo: false
  regras:
    - Abra pelo lugar ou pela data, não por um gancho gritado.
