# Pixel em Cena: direção visual da coleção Cinco estilos para cortes.
herda: base
nome: Pixel em Cena
conceito:
  frase: "Cenário tridimensional com textura de pixels e personagens em sprites que percorrem os lugares e executam ações mencionadas no corte."
  palavras_chave: [fala, explicação, pixel]
  faca: ["A ação do sprite precisa representar um verbo da fala, não apenas andar sem destino.", "Zoom não pode transformar pixels em manchas borradas; aplicar desfoque de profundidade só fora do foco.", "Não empregar sprites de jogos conhecidos."]
  nao_faca: ["Repetir o exemplo do estilo em outro assunto.", "Mostrar objeto, número ou fato que a fala não citou."]
cor:
  paleta: {fundo: '#111B36', superficie: '#2B3B5C', texto: '#F2ECD8', texto_suave: '#C9C4B4', primaria: '#57A7AD', destaque: '#E4B165', secundaria: '#B48AD8', positivo: '#3ECF8E', negativo: '#FF5D6C', alerta: '#FFA94D'}
tipografia:
  papeis:
    titulo: {familia: Bebas Neue, reserva: Impact, peso: 400, caixa_alta: true, espacamento: 0.02, entrelinha: 1.0}
    subtitulo: {familia: Bebas Neue, reserva: Impact, peso: 400, caixa_alta: true, espacamento: 0.08, entrelinha: 1.05}
    corpo: {familia: Montserrat ExtraBold, peso: 800, entrelinha: 1.25}
    dados: {familia: Montserrat ExtraBold, peso: 800, entrelinha: 1.1}
    legenda: {familia: Montserrat ExtraBold, peso: 800, caixa_alta: true, entrelinha: 1.08}
movimento:
  entrada: desliza
  principios: ["Deslocamento curto de câmera mostra o caminho; um sprite caminha até o objeto citado e para para a explicação. Ao falar de uma nova ação, troca de pose ou interação. Manter o cenário persistente entre as frases do mesmo assunto, sem gerar uma tela genérica para cada palavra."]
cenas:
  tom: Acompanha o que está sendo dito, frase a frase.
  intervalo: 1.5
  por_minuto: 30.0
  duracao: [1.0, 12.0]
  regras: ["Uma ação por frase, presa ao trecho dito."]
som:
  efeitos: {entrada: click, enfase: ding, numero: click, alerta: impacto}
  volume_efeitos: 0.3
x_direcao:
  id: clipator-arte-pixel-em-cena
  backend_sugerido: three
  complexidade: alta
  layout_padrao: em-cima
  proporcao_animacao: 0.5
  alternativa_leve: Polígonos isométricos com os lugares citados, sem o personagem.
graficos:
  selo: {cor_texto: neutro-1}
