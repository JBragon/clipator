# Geo em Cena: mapa geográfico real guiado pela fala.
herda: base
nome: Geo em Cena
conceito:
  frase: "O mapa aproxima de continentes para países e subdivisões reais, destacando somente os lugares mencionados na fala."
  palavras_chave: [fala, geografia, mapa real]
  faca: ["Destacar o polígono real do lugar citado, com os vizinhos como contexto.", "Avisar quando o lugar for ambíguo ou não estiver na base."]
  nao_faca: ["Repetir o exemplo do estilo em outro assunto.", "Desenhar silhueta, ponto ou cidade inventada.", "Mostrar número ou fato que a fala não citou."]
cor:
  paleta: {fundo: '#102737', superficie: '#1D3B4B', texto: '#F1F2E4', texto_suave: '#C7DBD6', primaria: '#55AEAA', destaque: '#EDB659', secundaria: '#A9A0DC', positivo: '#3ECF8E', negativo: '#FF5D6C', alerta: '#FFA94D'}
tipografia:
  papeis:
    titulo: {familia: Bebas Neue, reserva: Impact, peso: 400, caixa_alta: true, espacamento: 0.02, entrelinha: 1.0}
    subtitulo: {familia: Bebas Neue, reserva: Impact, peso: 400, caixa_alta: true, espacamento: 0.08, entrelinha: 1.05}
    corpo: {familia: Montserrat ExtraBold, peso: 800, entrelinha: 1.25}
    dados: {familia: Montserrat ExtraBold, peso: 800, entrelinha: 1.1}
    legenda: {familia: Montserrat ExtraBold, peso: 800, caixa_alta: true, entrelinha: 1.08}
movimento:
  entrada: desliza
  principios: ["A câmera aproxima do lugar no segundo em que ele é dito e para enquanto o nome é lido."]
cenas:
  tom: Acompanha o que está sendo dito, frase a frase.
  intervalo: 1.0
  por_minuto: 40.0
  duracao: [1.0, 12.0]
  regras: ["Uma ação por frase, presa ao trecho dito."]
som:
  efeitos: {entrada: click, enfase: ding, numero: click, alerta: impacto}
  volume_efeitos: 0.3
x_direcao:
  id: clipator-arte-geo-em-cena
  backend_sugerido: canvas
  complexidade: alta
  layout_padrao: em-cima
  proporcao_animacao: 0.5
  alternativa_leve: O mesmo mapa real, com a câmera cortando em vez de voar.
graficos:
  selo: {cor_texto: neutro-1}
