# Quadro de recortes: direção visual do pacote clipator-artes-originais (AGPL), importada de
# skills/clipator-arte-quadro-de-recortes/references/especificacao.json por `clipator.arte.importar`.
# O renderizador desta direção é outro trabalho; aqui ficam os tokens, o guia das cenas e as anotações x_.
herda: base
nome: Quadro de recortes
conceito:
  frase: Recortes próprios se encaixam numa grade de quadro didático e deixam visível a relação entre as partes.
  palavras_chave: [colagem didática, explicações com imagem, lista de componentes, antes/depois]
  faca: [Grade de três colunas com uma peça principal e duas notas menores., 'Fotos, setas de papel e números se
      alinham pela grade mesmo com pequenas rotações.', 'Cartolina quente, fotografias locais com margem irregular
      estreita e etiquetas de papel reciclado escuro.', 'Textura fica atrás do conteúdo, com borda cortada por polígonos
      de semente fixa.']
  nao_faca: [Copiar revistas ou recortes do pacote original., Sobrepor texturas ao rosto., Tremor contínuo após
      assentar.]
cor:
  paleta: {fundo: '#E9E0CC', superficie: '#D2C4A9', texto: '#313832', texto_suave: '#636558', primaria: '#A95135',
    destaque: '#598780', secundaria: '#CCA088', positivo: '#1E7F4F', negativo: '#B3261E', alerta: '#A85A00'}
tipografia:
  papeis:
    titulo: {familia: Bebas Neue, reserva: Impact, peso: 400, caixa_alta: true, espacamento: 0.02, entrelinha: 1.0}
    subtitulo: {familia: Bebas Neue, reserva: Impact, peso: 400, caixa_alta: true, espacamento: 0.08, entrelinha: 1.05}
    corpo: {familia: Montserrat ExtraBold, peso: 800, entrelinha: 1.25}
    dados: {familia: Montserrat ExtraBold, peso: 800, entrelinha: 1.1}
    legenda: {familia: Montserrat ExtraBold, peso: 800, caixa_alta: true, entrelinha: 1.08}
movimento:
  entrada: desliza
  principios: ['Uma mão não aparece: os recortes deslizam como movidos na mesa, assentam em dois passos e param.',
    A seta dobra pela metade antes de se abrir entre as peças.]
cenas:
  tom: Para explicações com imagem, lista de componentes e antes/depois.
  intervalo: 4.0
  por_minuto: 10.0
  duracao: [2.0, 6.0]
  regras: ['Sequência de cada cena: Assentar a peça principal na grade; Adicionar dois recortes de contexto; Abrir
      a seta que mostra a relação; Imobilizar as peças e destacar a conclusão.', A seta não toca uma peça diferente
      da pretendida., As bordas não mudam de forma quadro a quadro., Recortes não escondem palavras da fonte visual.]
som:
  efeitos: {entrada: click, enfase: ding, numero: click, alerta: impacto}
  volume_efeitos: 0.4
x_direcao:
  id: clipator-arte-quadro-de-recortes
  backend_sugerido: svg
  complexidade: media
  layout_padrao: em-cima
  proporcao_animacao: 0.5
  alternativa_leve: Cartões retangulares com a mesma grade e setas, retirando textura e borda irregular.
  construcao: Aplique offsets de stop-motion quantizados a 12 poses/s, calculados pelo tempo absoluto. Borda da
    mesma peça mantém a semente em toda a cena. Ordene z por papel, foto, seta, etiqueta e texto.
  parametros_visuais: {colunas: 3, fps_poses: 12, rotacao_maxima_graus: 3, margem_foto_relativa: 0.025}
graficos:
  selo: {cor_texto: neutro-2}
x_contraste_corrigido: ['texto_suave #717466 → #636558 (3.6:1 → 4.5:1)', 'destaque #5C8A83 → #598780 (3.0:1 → 3.1:1)',
  'texto #333A34 → #313832 (7:1 também sobre a superfície)']
