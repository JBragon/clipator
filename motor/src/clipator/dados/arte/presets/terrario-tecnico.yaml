# Terrário técnico: direção visual do pacote clipator-artes-originais (AGPL), importada de
# skills/clipator-arte-terrario-tecnico/references/especificacao.json por `clipator.arte.importar`.
# O renderizador desta direção é outro trabalho; aqui ficam os tokens, o guia das cenas e as anotações x_.
herda: base
nome: Terrário técnico
conceito:
  frase: Uma infraestrutura em miniatura aparece numa bandeja hexagonal com uma janela lateral que revela seu funcionamento.
  palavras_chave: [miniatura espacial, processos urbanos, energia, logística, funcionamento de serviços]
  faca: ['Bandeja hexagonal com base rasa, três zonas funcionais e um corte lateral em janela.', 'A informação principal
      usa o espaço livre à esquerda, ligada a uma peça por uma linha fina.', Pintura acetinada com vidro fosco só
      na janela., Miniaturas sem detalhes minúsculos; pisos e tubulações têm contraste de valor.]
  nao_faca: [Estratos de terreno decorativos em toda cena., Câmera que atravessa a geometria., Maquete sem função
      explicativa.]
cor:
  paleta: {fundo: '#112D32', superficie: '#20444A', texto: '#EDF3E7', texto_suave: '#9EB8B6', primaria: '#D9A65A',
    destaque: '#75B7C6', secundaria: '#6B6344', positivo: '#3ECF8E', negativo: '#FF5D6C', alerta: '#FFA94D'}
tipografia:
  papeis:
    titulo: {familia: Bebas Neue, reserva: Impact, peso: 400, caixa_alta: true, espacamento: 0.02, entrelinha: 1.0}
    subtitulo: {familia: Bebas Neue, reserva: Impact, peso: 400, caixa_alta: true, espacamento: 0.08, entrelinha: 1.05}
    corpo: {familia: Montserrat ExtraBold, peso: 800, entrelinha: 1.25}
    dados: {familia: Montserrat ExtraBold, peso: 800, entrelinha: 1.1}
    legenda: {familia: Montserrat ExtraBold, peso: 800, caixa_alta: true, entrelinha: 1.08}
movimento:
  entrada: mascara
  principios: [A câmera descreve um arco de no máximo 12 graus., Um percurso luminoso leva a atenção da entrada
      à saída; a tampa desliza para revelar o corte e retorna ao fim.]
cenas:
  tom: Para processos urbanos, energia, logística e funcionamento de serviços.
  intervalo: 5.0
  por_minuto: 8.0
  duracao: [2.0, 6.0]
  regras: ['Sequência de cada cena: Mostrar o conjunto e o ponto de entrada; Abrir a janela e percorrer o processo;
      Destacar o componente que explica o resultado; Fechar a janela e segurar uma vista limpa.', O caminho não
      some atrás de peças opacas durante a explicação., Rótulos permanecem dentro da área útil quando a câmera gira.,
    Não há pessoas minúsculas usadas para representar dados não fornecidos.]
som:
  efeitos: {entrada: click, enfase: ding, numero: click, alerta: impacto}
  volume_efeitos: 0.4
x_direcao:
  id: clipator-arte-terrario-tecnico
  backend_sugerido: three
  complexidade: alta
  layout_padrao: em-cima
  proporcao_animacao: 0.5
  alternativa_leve: Planta isométrica em SVG com janela de corte e percurso em traço; retirar vidro e volumes complexos.
  construcao: Separe cenário estático, componentes ativos e tampa. Projete os pontos de ancoragem 3D no HUD a cada
    seek; desvie cartões que colidirem. Animar o percurso por comprimento acumulado, mantendo a velocidade uniforme.
  parametros_visuais: {zonas: 3, arco_camera_graus: 12, altura_base_relativa: 0.12, velocidade_percurso: 0.8}
graficos:
  selo: {cor_texto: neutro-1}
