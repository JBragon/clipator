      a ordem das peças., 'O percurso explica a fala, em vez de só enfeitar o mecanismo.', Rótulos têm uma única
      peça de destino.]
som:
  efeitos: {entrada: click, enfase: ding, numero: click, alerta: impacto}
  volume_efeitos: 0.4
x_direcao:
  id: clipator-arte-mecanismo-facetado
  backend_sugerido: three
  complexidade: alta
  layout_padrao: em-cima
  proporcao_animacao: 0.5
  alternativa_leve: Polígonos isométricos SVG com a mesma separação por eixo e o mesmo percurso.
  construcao: Defina transformações base e deslocamentos explodidos por peça; interpole os dois estados. Conexões
    aparecem só quando as peças estão separadas. Especifique uma entrada, uma operação e uma saída por cena.
  parametros_visuais: {componentes: 4, explosao_relativa: 0.35, aproximacao_maxima: 0.08, duracao_separacao_s: 0.6}
graficos:
  selo: {cor_texto: neutro-1}
