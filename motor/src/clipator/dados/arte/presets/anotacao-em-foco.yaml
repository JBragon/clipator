# Anotação em foco: direção visual do pacote clipator-artes-originais (AGPL), importada de
# skills/clipator-arte-anotacao-em-foco/references/especificacao.json por `clipator.arte.importar`.
# O renderizador desta direção é outro trabalho; aqui ficam os tokens, o guia das cenas e as anotações x_.
herda: base
nome: Anotação em foco
conceito:
  frase: Uma frase aparece numa folha de estudo e um colchete lateral isola a parte mais importante.
  palavras_chave: [texto editorial, definições, argumento central, citações verificadas, conclusão]
  faca: ['Bloco de até três linhas, alinhado à esquerda; uma margem reservada a colchete e nota.', 'A linha ativa
      recebe uma faixa verde clara curta, com texto sempre escuro.', 'Papel claro com fibra quase imperceptível;
      tinta uniforme, sem letras que tremem.', Fonte de corpo legível e título condensado já disponível no Clipator.]
  nao_faca: [Parágrafo longo na tela., Tarja vermelha sem função., Legenda duplicada em cima do mesmo texto.]
cor:
  paleta: {fundo: '#F3EEDF', superficie: '#E0D8C5', texto: '#263938', texto_suave: '#5E6E6B', primaria: '#A14A35',
    destaque: '#7C8F44', realce: '#B5C876', secundaria: '#CEA492', positivo: '#1E7F4F', negativo: '#B3261E', alerta: '#A85A00'}
tipografia:
  papeis:
    titulo: {familia: Bebas Neue, reserva: Impact, peso: 400, caixa_alta: true, espacamento: 0.02, entrelinha: 1.0}
    subtitulo: {familia: Bebas Neue, reserva: Impact, peso: 400, caixa_alta: true, espacamento: 0.08, entrelinha: 1.05}
    corpo: {familia: Montserrat ExtraBold, peso: 800, entrelinha: 1.25}
    dados: {familia: Montserrat ExtraBold, peso: 800, entrelinha: 1.1}
    legenda: {familia: Montserrat ExtraBold, peso: 800, caixa_alta: true, entrelinha: 1.08}
movimento:
  entrada: mascara
  principios: ['Revelar por grupos semânticos, depois desenhar o colchete e abrir uma nota de até quatro palavras.',
    A faixa corre sob a linha inteira e para; não seguir cada sílaba.]
cenas:
  tom: Para definições, argumento central, citações verificadas e conclusão.
  intervalo: 3.0
  por_minuto: 12.0
  duracao: [2.0, 6.0]
  regras: ['Sequência de cada cena: Revelar a frase em dois grupos; Desenhar o colchete ao lado do trecho central;
      Abrir a nota curta na margem; Manter a frase completa até o fim.', A faixa não diminui o contraste., A nota
      não repete toda a frase., Nenhuma palavra aparece antes da âncora planejada.]
som:
  efeitos: {entrada: click, enfase: ding, numero: click, alerta: impacto}
  volume_efeitos: 0.4
x_direcao:
  id: clipator-arte-anotacao-em-foco
  backend_sugerido: svg
  complexidade: baixa
  layout_padrao: em-cima
  proporcao_animacao: 0.5
  alternativa_leve: Frase estática com colchete e faixa, sem animação de máscara.
  construcao: Meça linhas com a fonte carregada e crie retângulos a partir dos bounds reais. A anotação é uma camada
    diferente da legenda. Resolver âncora pelo trecho literal; citações só com entrada identificada como citação.
  parametros_visuais: {max_linhas: 3, max_palavras: 16, largura_margem_relativa: 0.16, opacidade_faixa: 0.55}
graficos:
  selo: {cor_texto: neutro-2}
x_contraste_corrigido: ['texto_suave #647571 → #5E6E6B (4.2:1 → 4.6:1)', 'destaque #B5C876 → #7C8F44 (1.6:1 → 3.1:1)']
