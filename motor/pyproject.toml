[project]
name = "clipator"
version = "0.1.3"
description = "Motor local do Clipator: transforma vídeos longos em clips curtos, com IA opcional."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [{ name = "Jordan Bragon" }]
keywords = ["video", "clips", "shorts", "whisper", "ffmpeg", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "pyyaml>=6",
  "pydantic>=2.6",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
  "yt-dlp[default]>=2026.10.26",  # [default] traz o yt-dlp-ejs (desafios do YouTube, com o Deno) e o pycryptodomex (cookies)
  "faster-whisper>=1.1",
  "mcp>=2.0",
  "pillow>=10.1",
]

[project.optional-dependencies]
visao = ["mediapipe>=0.10.14", "opencv-contrib-python>=4.9,<5"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
clipator = "clipator.cli:main"

[project.urls]
Homepage = "https://github.com/JBragon/clipator"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
